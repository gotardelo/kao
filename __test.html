<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>TDAHZEI — testes</title></head>
<body>
<pre id="out">rodando…</pre>
<script src="js/icons.js"></script>
<script src="js/store.js"></script>
<script src="js/auth.js"></script>
<script src="js/claude.js"></script>
<script src="js/markdown.js"></script>
<script>
var results = [];
function ok(name, cond, extra) { results.push((cond ? 'PASS ' : 'FAIL ') + name + (cond ? '' : '  << ' + (extra || ''))); }
function eq(name, a, b) { ok(name + ' (' + JSON.stringify(a) + ')', JSON.stringify(a) === JSON.stringify(b), 'esperado ' + JSON.stringify(b)); }

/* ---- fetch falso: devolve um stream SSE como a API real ---- */
var captured = null;
var realFetch = window.fetch.bind(window);
window.fetch = function (url, opts) {
  var enviado = JSON.parse(opts.body);
  captured = { url: String(url), headers: opts.headers, envelope: enviado, body: enviado.payload || enviado };

  var sse = [
    'data: {"choices":[{"index":0,"delta":{"role":"assistant","content":"Olá "}}]}',
    '',
    'data: {"choices":[{"index":0,"delta":{"content":"mundo"}}]}',
    '',
    'data: {"choices":[{"index":0,"delta":{},"finish_reason":"stop"}]}',
    '',
    'data: {"choices":[],"usage":{"prompt_tokens":150,"completion_tokens":45,"prompt_tokens_details":{"cached_tokens":27}}}',
    '',
    'data: [DONE]',
    ''
  ].join('\n');

  var enc = new TextEncoder();
  var chunks = [enc.encode(sse.slice(0, 90)), enc.encode(sse.slice(90))]; // corta no meio de propósito
  var i = 0;
  return Promise.resolve({
    ok: true, status: 200,
    json: function () { return Promise.resolve({ ok: true }); },
    body: { getReader: function () { return { read: function () {
      return Promise.resolve(i < chunks.length ? { done: false, value: chunks[i++] } : { done: true });
    } }; } }
  });
};

function run() {
  var uid;

  /* ============ AUTENTICAÇÃO ============ */
  return Auth.signup({ name: 'Ana Teste', email: 'ANA@Exemplo.com ', password: 'senha-forte-1!', password2: 'senha-forte-1!' })
    .then(function (u) {
      uid = u.id;
      ok('signup cria usuário', !!u.id);
      eq('e-mail normalizado', u.email, 'ana@exemplo.com');
      ok('senha não fica em claro', JSON.stringify(u).indexOf('senha-forte-1') === -1, JSON.stringify(u.pw));
      ok('sessão criada no signup', !!Auth.current() && Auth.current().id === uid);
      return Auth.signup({ name: 'Outro', email: 'ana@exemplo.com', password: 'senha-forte-1!', password2: 'senha-forte-1!' })
        .then(function () { ok('e-mail duplicado bloqueado', false); }, function () { ok('e-mail duplicado bloqueado', true); });
    })
    .then(function () {
      return Auth.login({ email: 'ana@exemplo.com', password: 'errada' })
        .then(function () { ok('senha errada rejeitada', false); }, function () { ok('senha errada rejeitada', true); });
    })
    .then(function () { return Auth.login({ email: 'ana@exemplo.com', password: 'senha-forte-1!' }); })
    .then(function (u) { ok('login com senha certa', u.id === uid); })
    .then(function () { return Auth.changePassword(uid, 'senha-forte-1!', 'nova-senha-9?', 'nova-senha-9?'); })
    .then(function () { return Auth.login({ email: 'ana@exemplo.com', password: 'nova-senha-9?' }); })
    .then(function (u) { ok('login com a senha nova', u.id === uid); })
    .then(function () {
      ok('senha fraca rejeitada', Auth.strength('123').score <= 1);
      ok('senha forte reconhecida', Auth.strength('Xy9!longa-senha').score === 4);

      /* ============ CHAVE DA API (AES-GCM) ============ */
      return Store.ApiKey.save(uid, 'sk-proj-CHAVE-SECRETA-123');
    })
    .then(function () {
      var raw = localStorage.getItem(Store.keys.apikey(uid));
      ok('chave não fica em claro no localStorage', raw.indexOf('CHAVE-SECRETA') === -1, raw);
      return Store.ApiKey.load(uid);
    })
    .then(function (key) {
      eq('chave descriptografa igual', key, 'sk-proj-CHAVE-SECRETA-123');

      /* ============ CONVERSAS ============ */
      var c = Store.Convs.create(uid);
      c.messages.push({ id: '1', role: 'user', content: 'oi' });
      Store.Convs.save(uid, c);
      eq('conversa salva e recuperada', Store.Convs.get(uid, c.id).messages.length, 1);
      Store.Convs.remove(uid, c.id);
      eq('conversa removida', Store.Convs.all(uid).length, 0);

      /* ============ MARKDOWN ============ */
      var xss = MD.render('<img src=x onerror=alert(1)>');
      ok('markdown escapa HTML', xss.indexOf('<img') === -1, xss);
      ok('negrito', MD.render('**forte**').indexOf('<strong>forte</strong>') > -1);
      ok('bloco de código', MD.render('```js\nvar a=1;\n```').indexOf('<code>var a=1;</code>') > -1);
      ok('lista', MD.render('- um\n- dois').indexOf('<li>um</li><li>dois</li>') > -1);
      ok('link', MD.render('[a](https://x.com)').indexOf('href="https://x.com"') > -1);
      ok('tabela', MD.render('| a | b |\n|---|---|\n| 1 | 2 |').indexOf('<th>a</th>') > -1);

      /* ============ HISTÓRICO → FORMATO DA API ============ */
      var api = Claude.toApiMessages([
        { role: 'assistant', content: 'sobra do começo' },
        { role: 'user', content: 'a' },
        { role: 'user', content: 'b' },
        { role: 'assistant', content: 'c' },
        { role: 'assistant', error: 'falhou' },
        { role: 'user', content: '  ' }
      ]);
      eq('descarta assistant no começo, erro e mensagem vazia', api,
         [{ role: 'user', content: 'a' }, { role: 'user', content: 'b' }, { role: 'assistant', content: 'c' }]);

      /* ============ STREAMING + CORPO DA REQUISIÇÃO ============ */
      var got = { text: '' };
      return Claude.stream(
        { apiKey: 'sk-proj-x', model: 'gpt-5.6-terra', effort: 'high', maxTokens: 8000,
          systemEstavel: 'sys', messages: [{ role: 'user', content: 'oi' }] },
        { onText: function (_, all) { got.text = all; } }
      ).promise.then(function (info) {
        eq('SSE remonta o texto entre chunks', got.text, 'Olá mundo');
        eq('tokens de entrada descontam o cache', info.usage.input_tokens, 123);
        eq('tokens lidos do cache', info.usage.cache_read_input_tokens, 27);
        eq('tokens de saída', info.usage.output_tokens, 45);
        eq('finish_reason stop', info.stopReason, 'stop');

        var b = captured.body;
        eq('vai pelo proxy local', captured.url, '/api/openai/chat');
        ok('a chave viaja no envelope, fora do payload',
           captured.envelope.apiKey === 'sk-proj-x' && !('apiKey' in b));
        eq('modelo enviado', b.model, 'gpt-5.6-terra');
        eq('stream ligado', b.stream, true);
        eq('pede o usage no fim do stream', b.stream_options, { include_usage: true });
        eq('usa max_completion_tokens', b.max_completion_tokens, 8000);
        ok('sem max_tokens (a OpenAI recusa nos modelos novos)', !('max_tokens' in b));
        ok('sem temperature', !('temperature' in b));
        eq('reasoning_effort enviado', b.reasoning_effort, 'high');
        eq('system vira a primeira mensagem', b.messages[0], { role: 'system', content: 'sys' });
        eq('mensagem do usuário preservada', b.messages[1], { role: 'user', content: 'oi' });
      });
    })
    .then(function () {
      /* effort 'none' não deve virar parâmetro */
      return Claude.stream({ apiKey: 'k', model: 'gpt-5.6-luna', effort: 'none', maxTokens: 8000,
        messages: [{ role: 'user', content: 'oi' }] }, {}).promise.then(function () {
        ok('effort "none" não vai na requisição', !('reasoning_effort' in captured.body));
      });
    })
    .then(function () {
      /* teto de saída do modelo limita o pedido */
      return Claude.stream({ apiKey: 'k', model: 'gpt-5.6-sol', effort: 'high', maxTokens: 999999,
        messages: [{ role: 'user', content: 'oi' }] }, {}).promise.then(function () {
        eq('max_completion_tokens limitado ao teto do modelo', captured.body.max_completion_tokens, 128000);
      });
    })
    .then(function () {
      /* ferramentas no formato function-calling da OpenAI */
      return Claude.stream({ apiKey: 'k', model: 'gpt-5.6-terra', maxTokens: 4000,
        messages: [{ role: 'user', content: 'oi' }],
        tools: [{ name: 'registrar_gasto', description: 'grava',
                  input_schema: { type: 'object', properties: { valor: { type: 'number' } },
                                  required: ['valor'], additionalProperties: false } }]
      }, {}).promise.then(function () {
        var t = captured.body.tools[0];
        eq('ferramenta com type function', t.type, 'function');
        eq('nome dentro de function', t.function.name, 'registrar_gasto');
        eq('input_schema vira parameters', t.function.parameters.required, ['valor']);
        eq('tool_choice automático', captured.body.tool_choice, 'auto');
      });
    })
    .then(function () {
      /* ============ USO / CUSTO ============ */
      Store.Usage.reset(uid);
      var u = Store.Usage.add(uid, 1000000, 1000000, 'gpt-5.6-terra');
      eq('custo gpt-5.6-terra (2 + 12)', Math.round(u.cost), 14);
      Store.Usage.reset(uid);
      var u2 = Store.Usage.add(uid, 1000000, 1000000, 'gpt-5.6-luna');
      ok('luna é muito mais barato que terra', u2.cost < u.cost, u2.cost + ' vs ' + u.cost);
      Auth.logout();
      ok('logout limpa a sessão', Auth.current() === null);
    })
    .catch(function (e) { results.push('FAIL exceção: ' + (e && e.message) + '\n' + (e && e.stack)); })
    .then(function () {
      var fails = results.filter(function (r) { return r.indexOf('FAIL') === 0; });
      var report = results.join('\n') + '\n\n===== ' + (results.length - fails.length) + '/' + results.length +
        ' passaram — ' + (fails.length ? 'HOUVE FALHAS' : 'TUDO VERDE') + ' =====';
      document.getElementById('out').textContent = report;
      realFetch('http://localhost:5174/r', { method: 'POST', body: report }).catch(function () {});
    });
}

window.addEventListener('error', function (e) { results.push('FAIL erro global: ' + e.message); });
run();
</script>
</body></html>
